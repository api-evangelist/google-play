naftiko: 1.0.0-alpha2
info:
  label: Google Play Developer API
  description: The Google Play Android Developer API allows developers to perform publishing and app-management tasks. It
    provides access to app publishing workflows, in-app product management, subscription handling, and purchase verification.
  tags:
  - Google
  - Play
  - API
  created: '2026-05-06'
  modified: '2026-05-06'
capability:
  consumes:
  - type: http
    namespace: google-play
    baseUri: https://androidpublisher.googleapis.com
    description: Google Play Developer API HTTP API.
    authentication:
      type: bearer
      token: '{{GOOGLE_PLAY_TOKEN}}'
    resources:
    - name: androidpublisher-v3-applications-packagename-edi
      path: /androidpublisher/v3/applications/{packageName}/edits
      operations:
      - name: createedit
        method: POST
        description: Google Play Developer Create a new edit
        inputParameters:
        - name: packageName
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: androidpublisher-v3-applications-packagename-ina
      path: /androidpublisher/v3/applications/{packageName}/inappproducts
      operations:
      - name: listinappproducts
        method: GET
        description: Google Play Developer List in-app products
        inputParameters:
        - name: packageName
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: androidpublisher-v3-applications-packagename-pur
      path: /androidpublisher/v3/applications/{packageName}/purchases/products/{productId}/tokens/{token}
      operations:
      - name: getpurchasestatus
        method: GET
        description: Google Play Developer Get purchase status
        inputParameters:
        - name: packageName
          in: path
          type: string
          required: true
        - name: productId
          in: path
          type: string
          required: true
        - name: token
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: androidpublisher-v3-applications-packagename-pur
      path: /androidpublisher/v3/applications/{packageName}/purchases/subscriptionsv2/tokens/{token}
      operations:
      - name: getsubscriptionstatus
        method: GET
        description: Google Play Developer Get subscription status
        inputParameters:
        - name: packageName
          in: path
          type: string
          required: true
        - name: token
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    port: 8080
    namespace: google-play-rest
    description: REST adapter for Google Play Developer API.
    resources:
    - path: /androidpublisher/v3/applications/{packageName}/edits
      name: createedit
      operations:
      - method: POST
        name: createedit
        description: Google Play Developer Create a new edit
        call: google-play.createedit
        with:
          packageName: rest.packageName
        outputParameters:
        - type: object
          mapping: $.
    - path: /androidpublisher/v3/applications/{packageName}/inappproducts
      name: listinappproducts
      operations:
      - method: GET
        name: listinappproducts
        description: Google Play Developer List in-app products
        call: google-play.listinappproducts
        with:
          packageName: rest.packageName
        outputParameters:
        - type: object
          mapping: $.
    - path: /androidpublisher/v3/applications/{packageName}/purchases/products/{productId}/tokens/{token}
      name: getpurchasestatus
      operations:
      - method: GET
        name: getpurchasestatus
        description: Google Play Developer Get purchase status
        call: google-play.getpurchasestatus
        with:
          packageName: rest.packageName
          productId: rest.productId
          token: rest.token
        outputParameters:
        - type: object
          mapping: $.
    - path: /androidpublisher/v3/applications/{packageName}/purchases/subscriptionsv2/tokens/{token}
      name: getsubscriptionstatus
      operations:
      - method: GET
        name: getsubscriptionstatus
        description: Google Play Developer Get subscription status
        call: google-play.getsubscriptionstatus
        with:
          packageName: rest.packageName
          token: rest.token
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    port: 9090
    namespace: google-play-mcp
    transport: http
    description: MCP adapter for Google Play Developer API for AI agent use.
    tools:
    - name: createedit
      description: Google Play Developer Create a new edit
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: google-play.createedit
      with:
        packageName: tools.packageName
      inputParameters:
      - name: packageName
        type: string
        description: packageName
        required: true
      outputParameters:
      - type: object
        mapping: $.
    - name: listinappproducts
      description: Google Play Developer List in-app products
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: google-play.listinappproducts
      with:
        packageName: tools.packageName
      inputParameters:
      - name: packageName
        type: string
        description: packageName
        required: true
      outputParameters:
      - type: object
        mapping: $.
    - name: getpurchasestatus
      description: Google Play Developer Get purchase status
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: google-play.getpurchasestatus
      with:
        packageName: tools.packageName
        productId: tools.productId
        token: tools.token
      inputParameters:
      - name: packageName
        type: string
        description: packageName
        required: true
      - name: productId
        type: string
        description: productId
        required: true
      - name: token
        type: string
        description: token
        required: true
      outputParameters:
      - type: object
        mapping: $.
    - name: getsubscriptionstatus
      description: Google Play Developer Get subscription status
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: google-play.getsubscriptionstatus
      with:
        packageName: tools.packageName
        token: tools.token
      inputParameters:
      - name: packageName
        type: string
        description: packageName
        required: true
      - name: token
        type: string
        description: token
        required: true
      outputParameters:
      - type: object
        mapping: $.
binds:
- namespace: env
  keys:
    GOOGLE_PLAY_TOKEN: GOOGLE_PLAY_TOKEN
